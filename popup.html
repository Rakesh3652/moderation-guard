<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Moderation Guard</title>
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 18px;
    font-family: system-ui, sans-serif;
    background: #1E2761;
    color: #FFFFFF;
  }
  h1 { font-size: 15px; margin: 0 0 14px; font-family: Georgia, serif; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .row span { font-size: 13.5px; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #5A6B93; border-radius: 22px; transition: .15s;
  }
  .slider::before {
    content: ""; position: absolute; height: 16px; width: 16px;
    left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .15s;
  }
  input:checked + .slider { background: #4CAF50; }
  input:checked + .slider::before { transform: translateX(18px); }
  button {
    width: 100%;
    background: #F96167;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { opacity: .9; }
  .hint { font-size: 11px; color: #CADCFC; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Moderation Guard</h1>
  <div class="row">
    <span>Filtering active</span>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </div>
  <button id="openDashboard">Open Dashboard</button>
  <div class="hint">Toggling applies immediately on open tabs. Already-hidden content on a page stays hidden until you reload it.</div>
  <script src="popup.js"></script>
</body>
</html>
